<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <!-- 오프라인 앱: 로컬 자원과 media:// (음악·커버)만 허용한다 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: media:; media-src 'self' media:; font-src 'self'"
    />
  </head>

  <body>
    <!-- 화면 내용과 문구는 각 화면 모듈과 messages.ts에서 채운다 -->
    <div id="app" class="app" data-tab="play" data-tone="idle">
      <div class="bg" aria-hidden="true">
        <div id="bg-cover-a" class="bg-cover"></div>
        <div id="bg-cover-b" class="bg-cover is-hidden"></div>
        <div class="bg-scrim"></div>
      </div>
      <div class="drag-region" aria-hidden="true"></div>

      <nav id="nav" class="nav"></nav>

      <main class="main">
        <section id="view-play" class="view view-play is-active" data-view="play"></section>
        <section id="view-schedule" class="view view-schedule" data-view="schedule"></section>
        <section id="view-songs" class="view view-songs" data-view="songs"></section>
        <section id="view-settings" class="view view-settings" data-view="settings"></section>
      </main>
    </div>

    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
